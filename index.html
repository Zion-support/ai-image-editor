<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Image Editor</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}canvas{background:#161b22;border-radius:8px;max-width:100%}#info{margin:.5rem 0;color:#9aa7b4}</style></head><body><h1>🎨 AI Image Editor</h1><p>Upload an image to preview client-side grayscale & brightness filters.</p><input type="file" id="f" accept="image/*"> <button onclick="gray()">Grayscale</button> <button onclick="bright()">+Brightness</button><div id="info"></div><canvas id="cv"></canvas><script>let img;document.getElementById('f').onchange=e=>{img=new Image();img.onload=()=>{const c=document.getElementById('cv');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);document.getElementById('info').textContent=img.width+'x'+img.height};img.src=URL.createObjectURL(e.target.files[0])};function px(fn){const c=document.getElementById('cv'),x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4)fn(d.data,i);x.putImageData(d,0,0)}function gray(){px((d,i)=>{const g=(d[i]+d[i+1]+d[i+2])/3;d[i]=d[i+1]=d[i+2]=g})}function bright(){px((d,i)=>{d[i]+=25;d[i+1]+=25;d[i+2]+=25})}</script><p><br>AI background removal, upscaling & batch pipelines: commercial@ziontechgroup.com</p><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-image-editor">GitHub</a> · <a href="https://ziontechgroup.com/ai-caption-generator/">Caption Generator</a></p></body></html>
